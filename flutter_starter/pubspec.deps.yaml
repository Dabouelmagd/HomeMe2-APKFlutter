# Copy these into your Flutter project's pubspec.yaml under `dependencies:`
# Run `flutter pub get` after copying.

dependencies:
  flutter:
    sdk: flutter

  # HTTP client with interceptors, retries, timeouts
  dio: ^5.4.0

  # Secure token persistence (Keychain on iOS, EncryptedSharedPreferences on Android)
  flutter_secure_storage: ^9.0.0

  # JSON serialization helpers
  json_annotation: ^4.9.0

  # Firebase + FCM push (optional, if you do push notifications)
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Device info for `device_info` field in register/login
  device_info_plus: ^9.1.2
  package_info_plus: ^5.0.1

  # Date formatting in Arabic
  intl: ^0.19.0

dev_dependencies:
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" fill="transparent"/>
  
  <!-- Circle/Globe Icon -->
  <g transform="translate(15, 30)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Circuit board pattern inside -->
    <line x1="-15" y1="-10" x2="-5" y2="-10" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-5" cy="-10" r="1.5" fill="#ffffff"/>
    <line x1="-5" y1="-10" x2="5" y2="-5" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="5" cy="-5" r="1.5" fill="#ffffff"/>
    
    <line x1="-10" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    <line x1="0" y1="0" x2="10" y2="5" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="10" cy="5" r="1.5" fill="#ffffff"/>
    
    <line x1="-8" y1="10" x2="0" y2="8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="8" r="1.5" fill="#ffffff"/>
    <line x1="0" y1="8" x2="8" y2="12" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Radiating lines -->
    <line x1="-20" y1="0" x2="-28" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <line x1="20" y1="0" x2="28" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <line x1="0" y1="-20" x2="0" y2="-28" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <line x1="0" y1="20" x2="0" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Text: DATA LIFE -->
  <text x="50" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">DATA LIFE</text>
  
  <!-- Subtitle: ARTIFICIAL INTELLIGENCE SERVICES -->
  <text x="50" y="42" font-family="Arial, sans-serif" font-size="7" fill="#e5e7eb">ARTIFICIAL INTELLIGENCE SERVICES</text>
</svg>
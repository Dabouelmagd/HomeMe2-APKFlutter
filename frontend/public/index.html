    <!-- GitHub Pages SPA routing fix -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

    <!-- Aggressive cache clearing and service worker management -->
    <script>
      const APP_VERSION = 'v1.2.1'; // Static version - only update on app changes
      
      // Light cache refresh for better user experience
      async function lightCacheRefresh() {
        try {
          const currentVersion = localStorage.getItem('homeme-cache-version');
          
          // Only clear cache if version has actually changed (manual update)
          if (!currentVersion || currentVersion !== APP_VERSION) {
            console.log('HomeMe: New app version detected, updating cache...');
            
            // Clear old caches selectively
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              for (const name of cacheNames) {
                if (name.includes('homeme') && !name.includes(APP_VERSION)) {
                  console.log('HomeMe: Removing old cache:', name);
                  await caches.delete(name);
                }
              }
            }
            
            localStorage.setItem('homeme-cache-version', APP_VERSION);
            console.log('HomeMe: Cache updated successfully');
          }
        } catch (e) {
          console.error('HomeMe: Error updating cache:', e);
        }
      }
      
      // Register new service worker with cache bypass
      async function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/',
              updateViaCache: 'none' // Don't cache the service worker itself
            });
            
            console.log('HomeMe: Service Worker registered');
            
            // Force update check - Auto reload disabled for stability
            registration.addEventListener('updatefound', () => {
              console.log('HomeMe: New service worker version detected');
              const newWorker = registration.installing;
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('HomeMe: New version available. Refresh manually to update.');
                  // Auto reload disabled to prevent navigation issues
                  // window.location.reload(true);
                }
              });
            });
            
            // Check for updates immediately
            registration.update();
            
          } catch (error) {
            console.error('HomeMe: Service Worker registration failed:', error);
          }
        }
      }
      
      // Execute on page load
      document.addEventListener('DOMContentLoaded', async () => {
        // Force clear all old service workers and caches to fix blank page
        // and to prevent the legacy SW from intercepting POST requests (which
        // causes the login button to hang on "جاري تسجيل الدخول...").
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) { await reg.unregister(); }
          }
          if ('caches' in window) {
            const names = await caches.keys();
            for (const n of names) { await caches.delete(n); }
          }
        } catch(e) { console.log('Cache cleanup:', e); }

        await lightCacheRefresh();
        // SW v5 is safe: it does NOT intercept any fetch (passthrough only),
        // so POSTs (login/register) cannot hang on it. Re-enabled to keep
        // push notifications & PWA install flow working.
        await registerServiceWorker();
      });
    </script>

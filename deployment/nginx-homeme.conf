# ── HomeMe — Virtual Host Config ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name homemeapp.net www.homemeapp.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name homemeapp.net www.homemeapp.net;

    ssl_certificate     /etc/letsencrypt/live/homemeapp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homemeapp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # ── Uploads / Static media ────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        expires            30d;
        add_header         Cache-Control "public, immutable";
    }

    # ── API → FastAPI backend (port 8002) ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }

    # ── Frontend → React (port 3002) ─────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

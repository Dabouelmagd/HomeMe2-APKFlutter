<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" fill="transparent"/>
  
  <!-- Circle/Globe Icon -->
  <g transform="translate(170, 30)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Circuit board pattern inside -->
    <line x1="-15" y1="-10" x2="-5" y2="-10" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="-5" cy="-10" r="1.5" fill="#1e3a8a"/>
    <line x1="-5" y1="-10" x2="5" y2="-5" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="5" cy="-5" r="1.5" fill="#1e3a8a"/>
    
    <line x1="-10" y1="0" x2="0" y2="0" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#1e3a8a"/>
    <line x1="0" y1="0" x2="10" y2="5" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="10" cy="5" r="1.5" fill="#1e3a8a"/>
    
    <line x1="-8" y1="10" x2="0" y2="8" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="8" r="1.5" fill="#1e3a8a"/>
    <line x1="0" y1="8" x2="8" y2="12" stroke="#1e3a8a" stroke-width="1.5"/>
    
    <!-- Radiating lines -->
    <line x1="-20" y1="0" x2="-28" y2="0" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="0" x2="28" y2="0" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-20" x2="0" y2="-28" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="20" x2="0" y2="28" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Text: داتا لايف (Data Life in Arabic) -->
  <text x="145" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="end" direction="rtl">داتا لايف</text>
</svg>
name: 🚀 Auto Deploy — HomeMe

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 167.233.119.52
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 HomeMe Auto Deploy Started"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd /opt/homeme

            # Pull latest
            git pull origin main

            # .env.production
            echo "REACT_APP_BACKEND_URL=https://homemeapp.net" > frontend/.env.production
            echo "DISABLE_ESLINT_PLUGIN=true" >> frontend/.env.production
            echo "GENERATE_SOURCEMAP=false" >> frontend/.env.production

            # Restart backend
            docker compose -f docker-compose.homeme.yml restart homeme-backend
            sleep 8

            # Build frontend
            cd frontend
            npm run build 2>&1 | tail -5

            # Check build size
            BUILD_SIZE=$(du -sk build/ | cut -f1)
            if [ "$BUILD_SIZE" -lt 5000 ]; then
              echo "❌ Build too small ($BUILD_SIZE KB) — possible error"
              exit 1
            fi

            # Deploy
            docker cp build/. homeme-frontend:/usr/share/nginx/html/
            docker exec homeme-frontend nginx -s reload

            echo ""
            echo "✅ Deploy complete — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🌐 https://homemeapp.net"
